<!DOCTYPE html>

    [data-netlify-deploy-id],

    [class*="NetlifyBadge"],

    div[style*="z-index: 2147483647"] {

<body class="flex justify-center text-slate-100 select-none">

      <a href="../../shopeeqn/index.html" class="flex-1 py-1 px-1.5 bg-slate-800/90 hover:bg-slate-700 text-amber-300 rounded-lg text-[10.5px] font-bold border border-slate-700 flex items-center justify-center gap-1 transition shadow-sm">

    <!-- 2. THANH RUY-BĂNG DÒNG CHỮ CHẠY LIÊN KẾT SHOPEE QN -->
    <section class="relative bg-gradient-to-r from-emerald-700 via-teal-700 to-emerald-800 text-white py-1 px-2 border-b-2 border-emerald-400 shadow shrink-0 z-30 overflow-hidden mt-1">
      <div class="max-w-7xl mx-auto">
        <a href="../../shopeeqn/index.html" class="block group cursor-pointer" title="Bấm để ghé thăm Shopee QN">
          <marquee behavior="scroll" direction="left" scrollamount="5" class="text-[11px] text-emerald-100 font-medium group-hover:text-amber-200 transition">
            📚 Để duy trì học liệu hoàn toàn miễn phí, rất mong quý khách mỗi khi mua hàng trên Shopee hãy ghé qua gian hàng liên kết của chúng tôi tại Shopee QN &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; 🛍️ Click vào đây để khám phá ngay!
          </marquee>
        </a>

    </section>

    <!-- Header Bài Học: Chọn Nghe Từ Bài ... Đến Bài ... -->
    <header class="bg-emerald-950/90 border border-emerald-700/60 rounded-xl px-2.5 py-1.5 flex items-center justify-between shadow shrink-0 gap-1 text-[11px] mt-1">
      <div class="flex items-center gap-1 font-semibold text-emerald-300">
        <span>Từ:</span>
        <select id="startLessonSelect" class="bg-emerald-900 text-white font-bold py-0.5 px-1 rounded border border-emerald-600 focus:outline-none text-xs">
        </select>
        <span class="ml-0.5">Đến:</span>
        <select id="endLessonSelect" class="bg-emerald-900 text-white font-bold py-0.5 px-1 rounded border border-emerald-600 focus:outline-none text-xs">
        </select>
      </div>

      <button id="toggleTransBtn" class="bg-emerald-700 hover:bg-emerald-600 px-2 py-1 rounded font-medium flex items-center gap-1 shadow transition text-xs">
        <i class="fa-solid fa-language text-xs"></i> <span>Dịch & IPA</span>
      </button>
    </header>

    <!-- Khung Nội Dung Bài Học -->
    <main class="flex-1 flex flex-col justify-between py-1 overflow-hidden" id="mainContent">
      <div id="currentCardContainer" class="h-full flex flex-col justify-between"></div>
    </main>

    <!-- Thanh Điều Khiển Cố Định Dưới Cùng & Popups Xổ Lên -->
    <footer class="bg-slate-950/95 border border-slate-800 rounded-xl p-2 shrink-0 space-y-1.5 relative">
      
      <!-- Popup Lựa Chọn Lặp Lại Xổ Lên Trên -->
      <div id="repeatMenu" class="hidden absolute bottom-[88px] left-1/2 -translate-x-1/2 bg-slate-900 border border-emerald-500/60 rounded-xl p-2 shadow-2xl z-50 flex items-center gap-1.5">
        <button data-repeat="1" class="repeat-opt px-2.5 py-1 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition">1x</button>
        <button data-repeat="2" class="repeat-opt px-2.5 py-1 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition">2x</button>
        <button data-repeat="3" class="repeat-opt px-2.5 py-1 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition">3x</button>
        <button data-repeat="5" class="repeat-opt px-2.5 py-1 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition">5x</button>
        <button data-repeat="999" class="repeat-opt px-2.5 py-1 rounded bg-slate-800 hover:bg-emerald-700 text-xs font-bold text-white transition">∞</button>
      </div>

      <!-- Popup Lựa Chọn Tốc Độ Xổ Lên Trên -->
      <div id="speedMenu" class="hidden absolute bottom-[88px] right-2 bg-slate-900 border border-cyan-500/60 rounded-xl p-2 shadow-2xl z-50 flex items-center gap-1.5">
        <button data-speed="0.5" class="speed-opt px-2 py-1 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">0.5</button>
        <button data-speed="0.75" class="speed-opt px-2 py-1 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">0.75</button>
        <button data-speed="1.0" class="speed-opt px-2 py-1 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">1.0</button>
        <button data-speed="1.25" class="speed-opt px-2 py-1 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">1.25</button>
        <button data-speed="1.5" class="speed-opt px-2 py-1 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">1.5</button>
        <button data-speed="2.0" class="speed-opt px-2 py-1 rounded bg-slate-800 hover:bg-cyan-700 text-xs font-bold text-white transition">2.0</button>
      </div>

      <!-- HÀNG 1: 3 Nút tùy chỉnh (Cân đối chiều rộng)[cite: 14] -->
      <div class="grid grid-cols-12 gap-1.5">
        <button id="voiceToggleBtn" class="col-span-6 py-1 px-2 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1 border border-emerald-600 transition shadow truncate">
          <i class="fa-solid fa-file-audio text-[11px]" id="voiceIcon"></i>
          <span id="voiceText">Gốc (MP3)</span>
        </button>

        <!-- Nút Lặp -->
        <button id="repeatToggleBtn" class="col-span-3 py-1 px-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-[11px] border border-slate-700 flex items-center justify-center gap-1 transition truncate">
          <i class="fa-solid fa-rotate text-[9px]"></i>
          <span id="repeatText">Lặp: 1</span>
        </button>

        <!-- Nút Tốc Độ -->
        <button id="speedToggleBtn" class="col-span-3 py-1 px-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-[11px] border border-slate-700 flex items-center justify-center gap-1 transition truncate">
          <i class="fa-solid fa-gauge-high text-[9px]"></i>
          <span id="speedText">1.0x</span>
        </button>
      </div>

      <!-- HÀNG 2: 3 Nút điều hướng & Phát (Cân đối tuyệt đối)[cite: 14] -->
      <div class="grid grid-cols-12 gap-1.5">
        <button id="prevBtn" class="col-span-2 h-8 bg-slate-800 hover:bg-slate-700 active:scale-95 text-gray-300 rounded-lg border border-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-backward-step text-sm"></i>
        </button>

        <button id="playBtn" class="col-span-8 h-8 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 shadow transition">
          <i class="fa-solid fa-play text-xs" id="playIcon"></i>
          <span id="playText">Phát Theo Dải</span>
        </button>

        <button id="nextBtn" class="col-span-2 h-8 bg-slate-800 hover:bg-slate-700 active:scale-95 text-gray-300 rounded-lg border border-slate-700 flex items-center justify-center transition">
          <i class="fa-solid fa-forward-step text-sm"></i>
        </button>
      </div>

    </footer>

  </div>

  <script src="js/data.js"></script>
  <script>
    const purgeNetlify = () => {
      document.querySelectorAll('iframe[src*="netlify"], [class*="netlify"], [class*="NetlifyBadge"], #netlify-drawer, div[data-netlify-deploy-id]').forEach(el => el.remove());
    };
    purgeNetlify();
    new MutationObserver(purgeNetlify).observe(document.documentElement, { childList: true, subtree: true });

    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let isSpeechUnlocked = false;

    function unlockAudioEngine() {
      if (!isSpeechUnlocked && synth) {
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          synth.speak(u);
          isSpeechUnlocked = true;
        } catch (e) {}
      }
    }
    document.body.addEventListener('touchstart', unlockAudioEngine, { once: true });
    document.body.addEventListener('click', unlockAudioEngine, { once: true });

    function getEnVoice() {
      if (!synth) return null;
      const voices = synth.getVoices() || [];
      return voices.find(v => v.lang === 'en-US' || v.lang === 'en_US') ||
             voices.find(v => v.lang.startsWith('en')) || null;
    }
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => { synth.getVoices(); };
    }

    let currentLessonIdx = 0;
    let startIdx = 0;
    let endIdx = 0;

    let currentMode = 'mp3';
    let currentSpeed = 1.0;
    let currentRepeatLimit = 1;
    let currentRepeat = 0;

    let isPlaying = false;
    let showDetails = true;
    let audioPlayer = new Audio();

    const startSelect = document.getElementById('startLessonSelect');
    const endSelect = document.getElementById('endLessonSelect');
    const currentCardContainer = document.getElementById('currentCardContainer');

    const repeatMenu = document.getElementById('repeatMenu');
    const speedMenu = document.getElementById('speedMenu');

    function initLessonSelectors() {
      startSelect.innerHTML = '';
      endSelect.innerHTML = '';
      if (typeof LESSONS_DATA === 'undefined') return;

      LESSONS_DATA.forEach((item, idx) => {
        const opt1 = document.createElement('option');
        opt1.value = idx;
        opt1.innerText = `${item.id}`;
        startSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = idx;
        opt2.innerText = `${item.id}`;
        endSelect.appendChild(opt2);
      });

      startIdx = 0;
      endIdx = Math.min(9, LESSONS_DATA.length - 1);
      startSelect.value = startIdx;
      endSelect.value = endIdx;
      currentLessonIdx = startIdx;
    }

    function renderLesson(idx) {
      if (typeof LESSONS_DATA === 'undefined' || !LESSONS_DATA[idx]) return;
      const item = LESSONS_DATA[idx];

      let sentencesHtml = '';
      if (item.sentences && item.sentences.length) {
        sentencesHtml = item.sentences.map((s, sIdx) => `
          <div id="sent-${sIdx}" class="sentence-row px-2 py-1 rounded-xl border border-slate-700/60 bg-slate-800/80 hover:bg-emerald-950/40 cursor-pointer transition flex flex-col justify-center" onclick="playSingleSentence('${s.en.replace(/'/g, "\\'")}', ${sIdx})">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-100 text-[12.5px] leading-tight">• ${s.en}</span>
              <i class="fa-solid fa-volume-high text-[10px] text-emerald-400 opacity-60 ml-1.5"></i>
            </div>
            <div class="trans-box ${showDetails ? '' : 'hidden'} mt-0.5 space-y-0.5 text-[10.5px]">
              <p class="ipa-text font-mono leading-tight">${s.ipa || ''}</p>
              <p class="vn-text font-medium leading-tight"><span class="bg-slate-700 text-slate-300 px-1 rounded text-[9px] mr-1">VN</span>${s.vi || ''}</p>
            </div>
          </div>
        `).join('');
      }

      currentCardContainer.innerHTML = `
        <div class="border border-emerald-500/50 bg-slate-900/90 rounded-2xl p-2 shadow-sm flex flex-col justify-between h-full">
          
          <div class="flex items-center justify-between pb-1 border-b border-slate-800 shrink-0">
            <span class="text-[10px] font-bold uppercase text-emerald-400 tracking-wider">Tình huống thực tế</span>
            <span class="w-6 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold">Bài ${item.id}</span>
          </div>

          <div class="w-full bg-slate-950/60 rounded-xl p-1 border border-slate-800/80 flex items-center justify-center overflow-hidden my-1 flex-1 min-h-[130px]">
            <img src="${item.image}" alt="Minh họa bài ${item.id}" 
                 class="max-w-full max-h-full object-contain scale-105 char-animation drop-shadow" 
                 onerror="this.src='extracted_images/card_${item.id}.png'">
          </div>

          <div class="space-y-1 shrink-0">
            ${sentencesHtml}
          </div>
        </div>
      `;
    }

    document.getElementById('repeatToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      speedMenu.classList.add('hidden');
      repeatMenu.classList.toggle('hidden');
    });

    document.getElementById('speedToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      repeatMenu.classList.add('hidden');
      speedMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      repeatMenu.classList.add('hidden');
      speedMenu.classList.add('hidden');
    });

    document.querySelectorAll('.repeat-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentRepeatLimit = parseInt(e.target.getAttribute('data-repeat'));
        currentRepeat = 0;
        updateRepeatDisplay();
        repeatMenu.classList.add('hidden');

        document.querySelectorAll('.repeat-opt').forEach(b => b.classList.remove('bg-emerald-600', 'text-white'));
        e.target.classList.add('bg-emerald-600', 'text-white');
      });
    });

    function updateRepeatDisplay() {
      const limitStr = currentRepeatLimit === 999 ? '∞' : `${currentRepeatLimit}`;
      document.getElementById('repeatText').innerText = `Lặp: ${limitStr}`;
      document.getElementById('repeatProgress').innerText = `(${currentRepeat}/${limitStr})`;
    }

    document.querySelectorAll('.speed-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentSpeed = parseFloat(e.target.getAttribute('data-speed'));
        document.getElementById('speedText').innerText = `${currentSpeed}x`;
        if (audioPlayer) audioPlayer.playbackRate = currentSpeed;
        speedMenu.classList.add('hidden');

        document.querySelectorAll('.speed-opt').forEach(b => b.classList.remove('bg-cyan-600', 'text-white'));
        e.target.classList.add('bg-cyan-600', 'text-white');
      });
    });

    startSelect.addEventListener('change', (e) => {
      stopPlayback();
      startIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        endIdx = startIdx;
        endSelect.value = endIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
      updateRepeatDisplay();
    });

    endSelect.addEventListener('change', (e) => {
      stopPlayback();
      endIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        startIdx = endIdx;
        startSelect.value = startIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
      updateRepeatDisplay();
    });

    const voiceBtn = document.getElementById('voiceToggleBtn');
    voiceBtn.addEventListener('click', () => {
      stopPlayback();
      if (currentMode === 'mp3') {
        currentMode = 'ai';
        voiceBtn.className = "col-span-6 py-1 px-2 rounded-lg bg-purple-700 hover:bg-purple-600 text-white font-bold text-xs flex items-center justify-center gap-1 border border-purple-600 transition shadow truncate";
        document.getElementById('voiceIcon').className = "fa-solid fa-robot text-[11px]";
        document.getElementById('voiceText').innerText = "AI Speech";
      } else {
        currentMode = 'mp3';
        voiceBtn.className = "col-span-6 py-1 px-2 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1 border border-emerald-600 transition shadow truncate";
        document.getElementById('voiceIcon').className = "fa-solid fa-file-audio text-[11px]";
        document.getElementById('voiceText').innerText = "Gốc (MP3)";
      }
    });

    document.getElementById('toggleTransBtn').addEventListener('click', () => {
      showDetails = !showDetails;
      document.querySelectorAll('.trans-box').forEach(el => el.classList.toggle('hidden', !showDetails));
      document.getElementById('toggleTransBtn').classList.toggle('bg-emerald-900', !showDetails);
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause text-xs";
        document.getElementById('playText').innerText = "Tạm Dừng";

        if (currentLessonIdx < startIdx || currentLessonIdx > endIdx) {
          currentLessonIdx = startIdx;
          renderLesson(currentLessonIdx);
        }
        currentRepeat = 0;
        updateRepeatDisplay();
        playCurrentLesson();
      }
    });

    function stopPlayback() {
      isPlaying = false;
      if (audioPlayer) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
      if (synth) synth.cancel();
      currentUtterance = null;
      document.getElementById('playIcon').className = "fa-solid fa-play text-xs";
      document.getElementById('playText').innerText = "Phát Theo Dải";
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
    }

    function handleLessonFinished() {
      if (!isPlaying) return;

      currentRepeat++;
      updateRepeatDisplay();

      if (currentRepeat < currentRepeatLimit) {
        setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 400);
      } else {
        currentRepeat = 0;
        updateRepeatDisplay();

        if (currentLessonIdx < endIdx) {
          currentLessonIdx++;
          renderLesson(currentLessonIdx);
          setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 600);
        } else {
          if (currentRepeatLimit === 999) {
            currentLessonIdx = startIdx;
            renderLesson(currentLessonIdx);
            setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 800);
          } else {
            stopPlayback();
          }
        }
      }
    }

    function playCurrentLesson() {
      if (!isPlaying) return;
      if (currentMode === 'mp3') {
        playMp3();
      } else {
        playAi(0);
      }
    }

    function playMp3() {
      audioPlayer.src = LESSONS_DATA[currentLessonIdx].mp3Url;
      audioPlayer.playbackRate = currentSpeed;
      
      audioPlayer.play().catch(() => {
        voiceBtn.click();
        playCurrentLesson();
      });

      audioPlayer.onended = () => {
        handleLessonFinished();
      };
    }

    function playAi(sIdx) {
      if (!synth || !isPlaying) return;
      const item = LESSONS_DATA[currentLessonIdx];

      if (!item.sentences || sIdx >= item.sentences.length) {
        handleLessonFinished();
        return;
      }

      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');

      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(item.sentences[sIdx].en);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };
      currentUtterance.onerror = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };

      synth.speak(currentUtterance);
    }

    window.playSingleSentence = function(text, sIdx) {
      stopPlayback();
      if (!synth) return;
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');
      
      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => row.classList.remove('active-sentence');
      currentUtterance.onerror = () => row.classList.remove('active-sentence');

      synth.speak(currentUtterance);
    };

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentLessonIdx > startIdx) {
        stopPlayback();
        currentLessonIdx--;
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        updateRepeatDisplay();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentLessonIdx < endIdx) {
        stopPlayback();
        currentLessonIdx++;
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        updateRepeatDisplay();
      }
    });

    initLessonSelectors();
    renderLesson(startIdx);
    updateRepeatDisplay();
  </script>
</body>
</html>
```[cite: 13, 14]
