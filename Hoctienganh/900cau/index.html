<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>900 Mẫu Câu Giao Tiếp Cùng Bé - VandonStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F4F7F5; /* Tone sáng tươi hợp Mệnh Mộc */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1e293b;
    }
    .ipa-text { color: #047857; font-style: italic; }
    .vn-text { color: #475569; }
    .active-sentence { border-color: #059669 !important; background-color: rgba(5, 150, 105, 0.12) !important; }
    .char-animation { animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    /* ================= BANNER & 3 NÚT ĐIỀU HƯỚNG ================= */
    .study-header-banner {
      background: #ffffff;
      border-bottom: 1.5px solid #d1fae5;
      padding: 8px 14px;
      text-align: center;
      flex-shrink: 0;
    }
    .study-header-banner a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 900;
      color: #065f46;
      text-decoration: none;
    }

    .study-actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 100%;
      padding: 6px 8px 4px;
      box-sizing: border-box;
      flex-shrink: 0;
      background: #ffffff;
    }
    .study-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 2px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .study-action-btn:hover { transform: translateY(-1px); }
    .btn-villa  { background: linear-gradient(135deg, #059669, #047857); }
    .btn-study  { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .btn-group  { background: linear-gradient(135deg, #0284c7, #0369a1); }

    /* ================= DẢI GÓC ỦNG HỘ & POPUP ================= */
    .shopee-promo-bar {
      width: 100%;
      padding: 0 8px 6px;
      box-sizing: border-box;
      flex-shrink: 0;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .shopee-promo-container {
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      border: 1px solid #059669;
      border-radius: 9px;
      padding: 4px 8px;
      box-shadow: 0 3px 10px rgba(5, 150, 105, 0.15);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .shopee-bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
    }
    .shopee-label {
      font-size: 9.5px;
      font-weight: 800;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .shopee-buttons-group {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .shopee-action-chip {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: 1px solid #fbbf24;
      color: #ffffff;
      font-size: 8.5px;
      font-weight: 800;
      padding: 1.5px 5px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 1px;
      box-shadow: 0 2px 4px rgba(245, 158, 11, 0.3);
      transition: all 0.2s;
      white-space: nowrap;
      cursor: pointer;
    }
    .shopee-action-chip:hover { background: #d97706; transform: translateY(-1px); }
    .shopee-marquee-row {
      font-size: 9px;
      font-weight: 600;
      color: #fef08a;
      overflow: hidden;
      border-top: 1px dashed rgba(52, 211, 153, 0.3);
      padding-top: 2px;
    }
    .shopee-marquee-row a {
      color: #fef08a;
      text-decoration: none;
      display: block;
    }

    /* Popup 27 danh mục cao cấp */
    .shopee-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }
    .shopee-modal-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      max-width: 750px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .shopee-modal-header {
      padding: 14px 18px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shopee-modal-title {
      font-size: 14px;
      font-weight: 900;
      color: #059669;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .shopee-modal-close {
      background: #e2e8f0;
      border: none;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shopee-modal-close:hover { background: #dc2626; color: #ffffff; }
    .shopee-modal-body {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: #ffffff;
    }
    .shopee-grid-item {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      color: #1e293b;
      padding: 10px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .shopee-grid-item:hover {
      background: #ecfdf5;
      border-color: #059669;
      color: #047857;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="flex justify-center text-slate-800 select-none">

  <script src="js/data.js"></script>
  <script>
    // Hàm mở/đóng Popup 27 danh mục Shopee
    function openShopeeModal() {
      document.getElementById('shopeeModal').style.display = 'flex';
    }
    function closeShopeeModal() {
      document.getElementById('shopeeModal').style.display = 'none';
    }
    window.addEventListener('click', function(e) {
      const modal = document.getElementById('shopeeModal');
      if (e.target === modal) {
        closeShopeeModal();
      }
    });

    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let isSpeechUnlocked = false;

    function unlockAudioEngine() {
      if (!isSpeechUnlocked && synth) {
        try {
          const u = new SpeechSynthesisUtterance('');
          u.volume = 0;
          synth.speak(u);
          isSpeechUnlocked = true;
        } catch (e) {}
      }
    }
    document.body.addEventListener('touchstart', unlockAudioEngine, { once: true });
    document.body.addEventListener('click', unlockAudioEngine, { once: true });

    function getEnVoice() {
      if (!synth) return null;
      const voices = synth.getVoices() || [];
      return voices.find(v => v.lang === 'en-US' || v.lang === 'en_US') ||
             voices.find(v => v.lang.startsWith('en')) || null;
    }
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => { synth.getVoices(); };
    }

    let currentLessonIdx = 0;
    let startIdx = 0;
    let endIdx = 0;

    let currentMode = 'mp3';
    let currentSpeed = 1.0;
    let currentRepeatLimit = 1;
    let currentRepeat = 0;

    let isPlaying = false;
    // MẶC ĐỊNH LÀ CHƯA DỊCH VÀ IPA (showDetails = false)
    let showDetails = false;
    let audioPlayer = new Audio();

    const startSelect = document.getElementById('startLessonSelect');
    const endSelect = document.getElementById('endLessonSelect');
    const currentCardContainer = document.getElementById('currentCardContainer');

    const repeatMenu = document.getElementById('repeatMenu');
    const speedMenu = document.getElementById('speedMenu');

    function initLessonSelectors() {
      startSelect.innerHTML = '';
      endSelect.innerHTML = '';
      if (typeof LESSONS_DATA === 'undefined') return;

      LESSONS_DATA.forEach((item, idx) => {
        const opt1 = document.createElement('option');
        opt1.value = idx;
        opt1.innerText = `${item.id}`;
        startSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = idx;
        opt2.innerText = `${item.id}`;
        endSelect.appendChild(opt2);
      });

      // MẶC ĐỊNH TỪ BÀI 1 ĐẾN BÀI 1
      startIdx = 0;
      endIdx = 0;
      startSelect.value = startIdx;
      endSelect.value = endIdx;
      currentLessonIdx = startIdx;
    }

    function renderLesson(idx) {
      if (typeof LESSONS_DATA === 'undefined' || !LESSONS_DATA[idx]) return;
      const item = LESSONS_DATA[idx];

      let sentencesHtml = '';
      if (item.sentences && item.sentences.length) {
        sentencesHtml = item.sentences.map((s, sIdx) => `
          <div id="sent-${sIdx}" class="sentence-row px-2.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-emerald-50/50 cursor-pointer transition flex flex-col justify-center shadow-sm" onclick="playSingleSentence('${s.en.replace(/'/g, "\\'")}', ${sIdx})">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800 text-[13px] leading-tight">• ${s.en}</span>
              <i class="fa-solid fa-volume-high text-[11px] text-emerald-600 opacity-80 ml-1.5"></i>
            </div>
            <!-- MẶC ĐỊNH ẨN DỊCH & IPA NẾU showDetails = false -->
            <div class="trans-box ${showDetails ? '' : 'hidden'} mt-0.5 space-y-0.5 text-[11px]">
              <p class="ipa-text font-mono leading-tight">${s.ipa || ''}</p>
              <p class="vn-text font-medium leading-tight"><span class="bg-emerald-100 text-emerald-800 px-1 rounded text-[9px] mr-1 font-bold">VN</span>${s.vi || ''}</p>
            </div>
          </div>
        `).join('');
      }

      currentCardContainer.innerHTML = `
        <div class="border border-emerald-200 bg-emerald-50/30 rounded-2xl p-2 shadow-sm flex flex-col justify-between h-full">
          
          <div class="flex items-center justify-between pb-1 border-b border-emerald-100 shrink-0">
            <span class="text-[10.5px] font-black uppercase text-emerald-800 tracking-wider">Tình huống thực tế</span>
            <span class="px-2 py-0.5 rounded-full bg-emerald-700 text-white flex items-center justify-center text-[10.5px] font-black">Bài ${item.id}</span>
          </div>

          <div class="w-full bg-white rounded-xl p-1 border border-emerald-100 flex items-center justify-center overflow-hidden my-1 flex-1 min-h-[130px] shadow-inner">
            <img src="${item.image}" alt="Minh họa bài ${item.id}" 
                 class="max-w-full max-h-full object-contain scale-105 char-animation drop-shadow-sm" 
                 onerror="this.src='extracted_images/card_${item.id}.png'">
          </div>

          <div class="space-y-1.5 shrink-0">
            ${sentencesHtml}
          </div>
        </div>
      `;
    }

    document.getElementById('repeatToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      speedMenu.classList.add('hidden');
      repeatMenu.classList.toggle('hidden');
    });

    document.getElementById('speedToggleBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      repeatMenu.classList.add('hidden');
      speedMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      repeatMenu.classList.add('hidden');
      speedMenu.classList.add('hidden');
    });

    document.querySelectorAll('.repeat-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentRepeatLimit = parseInt(e.target.getAttribute('data-repeat'));
        currentRepeat = 0;
        updateRepeatDisplay();
        repeatMenu.classList.add('hidden');

        document.querySelectorAll('.repeat-opt').forEach(b => b.classList.remove('bg-emerald-600', 'text-white'));
        e.target.classList.add('bg-emerald-600', 'text-white');
      });
    });

    function updateRepeatDisplay() {
      const limitStr = currentRepeatLimit === 999 ? '∞' : `${currentRepeatLimit}`;
      document.getElementById('repeatText').innerText = `Lặp: ${limitStr}`;
    }

    document.querySelectorAll('.speed-opt').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentSpeed = parseFloat(e.target.getAttribute('data-speed'));
        document.getElementById('speedText').innerText = `${currentSpeed}x`;
        if (audioPlayer) audioPlayer.playbackRate = currentSpeed;
        speedMenu.classList.add('hidden');

        document.querySelectorAll('.speed-opt').forEach(b => b.classList.remove('bg-emerald-600', 'text-white'));
        e.target.classList.add('bg-emerald-600', 'text-white');
      });
    });

    startSelect.addEventListener('change', (e) => {
      stopPlayback();
      startIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        endIdx = startIdx;
        endSelect.value = endIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
      updateRepeatDisplay();
    });

    endSelect.addEventListener('change', (e) => {
      stopPlayback();
      endIdx = parseInt(e.target.value);
      if (endIdx < startIdx) {
        startIdx = endIdx;
        startSelect.value = startIdx;
      }
      currentLessonIdx = startIdx;
      renderLesson(currentLessonIdx);
      currentRepeat = 0;
      updateRepeatDisplay();
    });

    const voiceBtn = document.getElementById('voiceToggleBtn');
    voiceBtn.addEventListener('click', () => {
      stopPlayback();
      if (currentMode === 'mp3') {
        currentMode = 'ai';
        voiceBtn.className = "w-full h-8 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 border border-teal-600 transition shadow-sm truncate";
        document.getElementById('voiceIcon').className = "fa-solid fa-robot text-[12px]";
        document.getElementById('voiceText').innerText = "AI Speech";
      } else {
        currentMode = 'mp3';
        voiceBtn.className = "w-full h-8 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 border border-emerald-600 transition shadow-sm truncate";
        document.getElementById('voiceIcon').className = "fa-solid fa-file-audio text-[12px]";
        document.getElementById('voiceText').innerText = "Gốc (MP3)";
      }
    });

    // XỬ LÝ NÚT BẬT/TẮT DỊCH & IPA
    document.getElementById('toggleTransBtn').addEventListener('click', () => {
      showDetails = !showDetails;
      document.querySelectorAll('.trans-box').forEach(el => el.classList.toggle('hidden', !showDetails));
      document.getElementById('toggleTransBtn').classList.toggle('bg-emerald-800', showDetails);
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        isPlaying = true;
        document.getElementById('playIcon').className = "fa-solid fa-pause text-xs";
        document.getElementById('playText').innerText = "Tạm Dừng";

        if (currentLessonIdx < startIdx || currentLessonIdx > endIdx) {
          currentLessonIdx = startIdx;
          renderLesson(currentLessonIdx);
        }
        currentRepeat = 0;
        updateRepeatDisplay();
        playCurrentLesson();
      }
    });

    function stopPlayback() {
      isPlaying = false;
      if (audioPlayer) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
      if (synth) synth.cancel();
      currentUtterance = null;
      document.getElementById('playIcon').className = "fa-solid fa-play text-xs";
      document.getElementById('playText').innerText = "Phát Theo Dải";
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
    }

    function handleLessonFinished() {
      if (!isPlaying) return;

      currentRepeat++;
      updateRepeatDisplay();

      if (currentRepeat < currentRepeatLimit) {
        setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 400);
      } else {
        currentRepeat = 0;
        updateRepeatDisplay();

        if (currentLessonIdx < endIdx) {
          currentLessonIdx++;
          renderLesson(currentLessonIdx);
          setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 600);
        } else {
          if (currentRepeatLimit === 999) {
            currentLessonIdx = startIdx;
            renderLesson(currentLessonIdx);
            setTimeout(() => { if (isPlaying) playCurrentLesson(); }, 800);
          } else {
            stopPlayback();
          }
        }
      }
    }

    function playCurrentLesson() {
      if (!isPlaying) return;
      if (currentMode === 'mp3') {
        playMp3();
      } else {
        playAi(0);
      }
    }

    function playMp3() {
      audioPlayer.src = LESSONS_DATA[currentLessonIdx].mp3Url;
      audioPlayer.playbackRate = currentSpeed;
      
      audioPlayer.play().catch(() => {
        voiceBtn.click();
        playCurrentLesson();
      });

      audioPlayer.onended = () => {
        handleLessonFinished();
      };
    }

    function playAi(sIdx) {
      if (!synth || !isPlaying) return;
      const item = LESSONS_DATA[currentLessonIdx];

      if (!item.sentences || sIdx >= item.sentences.length) {
        handleLessonFinished();
        return;
      }

      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');

      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(item.sentences[sIdx].en);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };
      currentUtterance.onerror = () => {
        if (isPlaying) setTimeout(() => playAi(sIdx + 1), 350);
      };

      synth.speak(currentUtterance);
    }

    window.playSingleSentence = function(text, sIdx) {
      stopPlayback();
      if (!synth) return;
      document.querySelectorAll('.sentence-row').forEach(el => el.classList.remove('active-sentence'));
      const row = document.getElementById(`sent-${sIdx}`);
      if (row) row.classList.add('active-sentence');
      
      synth.cancel();
      if (synth.paused) synth.resume();

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.lang = 'en-US';
      currentUtterance.rate = currentSpeed;
      
      const v = getEnVoice();
      if (v) currentUtterance.voice = v;

      currentUtterance.onend = () => row.classList.remove('active-sentence');
      currentUtterance.onerror = () => row.classList.remove('active-sentence');

      synth.speak(currentUtterance);
    };

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentLessonIdx > startIdx) {
        stopPlayback();
        currentLessonIdx--;
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        updateRepeatDisplay();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentLessonIdx < endIdx) {
        stopPlayback();
        currentLessonIdx++;
        renderLesson(currentLessonIdx);
        currentRepeat = 0;
        updateRepeatDisplay();
      }
    });

    // Khởi tạo các ô chọn bài và tải bài học ban đầu
    initLessonSelectors();
    renderLesson(startIdx);
    updateRepeatDisplay();
  </script>
</body>
</html>
